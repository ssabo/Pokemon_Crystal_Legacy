name: Build ROM

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libpng-dev

      - name: Install RGBDS 0.5.2
        run: |
          curl -fsSL https://github.com/gbdev/rgbds/releases/download/v0.5.2/rgbds-0.5.2-linux-x86_64.tar.xz -o rgbds.tar.xz
          mkdir -p rgbds
          tar -xf rgbds.tar.xz -C rgbds
          echo "${{ github.workspace }}/rgbds" >> $GITHUB_PATH

      - name: Build ROMs
        run: make crystal crystal11 crystal_au crystal11_vc RGBDS=${{ github.workspace }}/rgbds/

      - name: Upload ROM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rom-builds
          path: |
            *.gbc
            *.patch
          retention-days: 30
